# Exercise 2.10. Close the ports
# created at Oct 24, 2026 18:43 HKT

services:
  frontend:
    image: walkerchu/devops-spring:frontend-2-10
    environment:
      - REACT_APP_BACKEND_URL=http://localhost:8000/api

  backend:
    image: walkerchu/devops-spring:backend
    container_name: backend
    environment:
      - REDIS_HOST=redis
      - REQUEST_ORIGIN=http://localhost:8000 # use port 5001 if without proxy
      - POSTGRES_HOST=db
      - POSTGRES_PASSWORD=example
    depends_on:
      - redis
      - db
    restart: unless-stopped

  redis:
    image: redis:alpine3.23

  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: example
    container_name: postgres
    volumes:
      - ./database:/var/lib/postgresql

  nginx:
    image: nginx:alpine
    ports:
      - 8000:80
    container_name: reverse-proxy
    depends_on:
      - frontend
      - backend
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
