services:
  frontend:
    image: walkerchu/devops-spring:frontend
    ports:
      - 5001:5001
    networks:
      - shared-networks
    container_name: frontend

  backend:
    image: walkerchu/devops-spring:backend
    ports:
      - 8080:8080
    networks:
      - shared-networks
    container_name: backend

networks:
  shared-networks:
    driver: bridge
    name: shared-networks
