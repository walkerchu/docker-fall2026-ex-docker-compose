# url: https://courses.mooc.fi/org/uh-cs/courses/devops-with-docker-fall-2026/chapter-3/migrating-to-docker-compose
# Exercise 2.4. Redis
# created at Oct 22, 2026 23:36 HKT

services:
  frontend:
    image: walkerchu/devops-spring:frontend
    ports:
      - 5001:5001
    container_name: frontend

  backend:
    image: walkerchu/devops-spring:backend
    ports:
      - 8080:8080
    container_name: backend
    environment:
      - REDIS_HOST=cache-service
    depends_on:
      - cache-service
    restart: unless-stopped

  cache-service:
    image: redis:alpine3.23
