services:
  frontend:
    image: walkerchu/devops-spring:frontend
    ports:
      - 5001:5001
    container_name: frontend

  backend:
    image: walkerchu/devops-spring:backend
    ports:
      - 8080:8080
    container_name: backend
    environment:
      - REDIS_HOST=cache-service
      - REQUEST_ORIGIN=http://localhost:8000 # use port 5001 if without proxy
      - POSTGRES_HOST=db
      - POSTGRES_PASSWORD=example
    depends_on:
      - cache-service
      - db
    restart: unless-stopped

  cache-service:
    image: redis:alpine3.23

  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: example
    container_name: postgres
    volumes:
      - ./database:/var/lib/postgresql

  nginx:
    image: nginx:alpine
    ports:
      - 8000:80
    container_name: reverse-proxy
    depends_on:
      - frontend
      - backend
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
